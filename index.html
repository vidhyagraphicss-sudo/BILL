<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIDHYA GRAPHICS - Cash Bill</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
    body { font-family: Arial, sans-serif; background: #f4f4f4; margin: 0; padding: 20px; }
    .invoice-box { max-width: 800px; margin: auto; background: #fff; padding: 30px; border: 1px solid #ddd; box-shadow: 0 0 10px rgba(0,0,0,0.15); box-sizing: border-box; }
    .header { text-align: center; border-bottom: 2px solid #333; padding-bottom: 15px; margin-bottom: 20px; }
    .header h1 { margin: 0; font-size: 26px; letter-spacing: 1px; color: #111; }
    .header p { margin: 4px 0; font-size: 13px; color: #555; }
    .bill-title { text-align: center; font-weight: bold; text-decoration: underline; font-size: 16px; margin: 15px 0; color: #333; }
    .meta-info { display: flex; justify-content: space-between; margin-bottom: 20px; font-size: 14px; }
    .meta-info div { width: 48%; }
    .meta-info label { font-weight: bold; }
    .meta-info input, .meta-info textarea { width: 100%; padding: 6px; margin-top: 4px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    textarea { resize: none; font-family: Arial, sans-serif; }
    table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
    table, th, td { border: 1px solid #000; }
    th, td { padding: 8px; text-align: center; font-size: 13px; }
    th { background-color: #f8f8f8; }
    td.particulars { text-align: left; }
    input.table-input { width: 100%; border: none; background: transparent; text-align: center; font-size: 13px; }
    input.table-input.particulars { text-align: left; }
    input.table-input:focus { outline: 1px solid #007bff; }
    .total-row td { font-weight: bold; background-color: #fdfdfd; }
    .signature-section { margin-top: 50px; padding-bottom: 20px; display: flex; justify-content: flex-end; page-break-inside: avoid; }
    .signature-box { width: 260px; border-top: 1px solid #000; padding-top: 6px; font-size: 14px; text-align: center; }
    .signature-img-container { height: 65px; margin-bottom: 5px; display: flex; justify-content: center; align-items: center; }
    .signature-img-container img { max-height: 60px; max-width: 200px; object-fit: contain; }
    .sig-name-input { width: 100%; border: none; text-align: center; font-weight: bold; font-size: 15px; font-family: Arial, sans-serif; background: transparent; color: #000; }
    .sig-name-input:focus { outline: 1px solid #007bff; }
    .signature-label { font-size: 13px; font-weight: normal; margin-top: 2px; color: #333; }
    .no-print { text-align: center; margin-top: 20px; }
    .controls-panel { max-width: 800px; margin: 15px auto; background: #fff; padding: 15px 30px; border: 1px solid #ddd; box-shadow: 0 0 10px rgba(0,0,0,0.1); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; box-sizing: border-box; }
    .btn { background-color: #007bff; color: white; border: none; padding: 10px 20px; font-size: 14px; cursor: pointer; border-radius: 4px; }
    .btn:hover { background-color: #0056b3; }
    .btn-success { background-color: #28a745; }
    .btn-success:hover { background-color: #218838; }
    .btn-danger { background-color: #dc3545; padding: 4px 8px; font-size: 12px; }
    .btn-danger:hover { background-color: #bd2130; }
    .custom-file-upload { border: 1px solid #ccc; display: inline-block; padding: 8px 12px; cursor: pointer; background: #f8f8f8; border-radius: 4px; font-size: 13px; }
    .custom-file-upload:hover { background: #e2e2e2; }

    @page { size: A4; margin: 0; }
    @media print {
        body { background: none; padding: 0; }
        .invoice-box { border: none; box-shadow: none; padding: 15mm; max-width: 100%; }
        .no-print, .controls-panel, .btn, .no-print-col, #pdfStage { display: none !important; }
        input, textarea { border: none !important; outline: none !important; background: transparent !important; }
    }
</style>
</head>
<body>

<div class="invoice-box" id="invoiceContainer">
    <div class="header">
        <h1>VIDHYA GRAPHICS</h1>
        <p>Muttikulangara, Palakkad - 678594</p>
        <p>Ph: 9048023437, 9072823437</p>
        <p>Email: vidhyagraphicss@gmail.com</p>
    </div>

    <div class="bill-title">CASH BILL</div>

    <div class="meta-info">
        <div><label>NO:</label> <input type="text" id="billNo" value="001"></div>
        <div><label>Date:</label> <input type="date" id="billDate"></div>
    </div>

    <div class="meta-info" style="width: 100%;">
        <div style="width: 100%;">
            <label>Name & Address:</label>
            <textarea id="custAddress" rows="2" placeholder="Enter customer name and address"></textarea>
        </div>
    </div>

    <table id="billTable">
        <thead>
            <tr>
                <th style="width: 8%;">Sl. No.</th>
                <th style="width: 44%;">Particulars</th>
                <th style="width: 12%;">Rate (Rs.)</th>
                <th style="width: 10%;">Qty</th>
                <th style="width: 16%;">Amount (Rs.)</th>
                <th style="width: 10%;" class="no-print-col">Action</th>
            </tr>
        </thead>
        <tbody id="itemRows">
            <tr>
                <td>1</td>
                <td class="particulars"><input type="text" class="table-input particulars" placeholder="Item description"></td>
                <td><input type="number" class="table-input rate" oninput="calculateRow(this)" placeholder="0.00"></td>
                <td><input type="number" class="table-input qty" oninput="calculateRow(this)" placeholder="0"></td>
                <td><input type="number" class="table-input amount" readonly placeholder="0.00"></td>
                <td class="no-print-col"><button type="button" class="btn btn-danger" onclick="deleteRow(this)">X</button></td>
            </tr>
        </tbody>
        <tfoot>
            <tr class="total-row">
                <td colspan="4" style="text-align: right; padding-right: 15px;">TOTAL</td>
                <td id="grandTotal" style="text-align: center;">0.00</td>
                <td class="no-print-col"></td>
            </tr>
        </tfoot>
    </table>

    <div class="no-print" style="margin-bottom: 20px; text-align: left;">
        <button type="button" class="btn" onclick="addRow()">+ Add Item</button>
    </div>

    <div class="signature-section">
        <div class="signature-box">
            <div class="signature-img-container" id="sigImageContainer"></div>
            <input type="text" class="sig-name-input" id="sigNameInput" value="" placeholder="Enter Name">
            <div class="signature-label">Signature</div>
        </div>
    </div>
</div>

<div class="controls-panel">
    <div>
        <label class="custom-file-upload">
            <input type="file" id="sigFile" accept="image/*" onchange="loadSignature(event)" style="display:none;"/>
            Upload Stamp / Signature Image
        </label>
    </div>
    <div>
        <button type="button" class="btn btn-success" onclick="downloadPDF()">Download PDF</button>
        <button type="button" class="btn" onclick="window.print()">Print Bill</button>
    </div>
</div>

<script>
    document.getElementById('billDate').valueAsDate = new Date();

    function addRow() {
        const tbody = document.getElementById('itemRows');
        const newRow = tbody.insertRow();
        newRow.innerHTML = `
            <td>${tbody.rows.length}</td>
            <td class="particulars"><input type="text" class="table-input particulars" placeholder="Item description"></td>
            <td><input type="number" class="table-input rate" oninput="calculateRow(this)" placeholder="0.00"></td>
            <td><input type="number" class="table-input qty" oninput="calculateRow(this)" placeholder="0"></td>
            <td><input type="number" class="table-input amount" readonly placeholder="0.00"></td>
            <td class="no-print-col"><button type="button" class="btn btn-danger" onclick="deleteRow(this)">X</button></td>
        `;
    }

    function deleteRow(button) {
        button.closest('tr').remove();
        document.querySelectorAll('#itemRows tr').forEach((row, i) => { row.cells[0].innerText = i + 1; });
        calculateGrandTotal();
    }

    function calculateRow(el) {
        const row = el.closest('tr');
        const rate = parseFloat(row.querySelector('.rate').value) || 0;
        const qty = parseFloat(row.querySelector('.qty').value) || 0;
        row.querySelector('.amount').value = (rate * qty).toFixed(2);
        calculateGrandTotal();
    }

    function calculateGrandTotal() {
        let total = 0;
        document.querySelectorAll('.amount').forEach(i => { total += parseFloat(i.value) || 0; });
        document.getElementById('grandTotal').innerText = total.toFixed(2);
    }

    function loadSignature(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = e => {
            document.getElementById('sigImageContainer').innerHTML = `<img src="${e.target.result}" alt="Signature">`;
        };
        reader.readAsDataURL(file);
    }

    function formatDate(v) {
        if (!v) return '';
        const p = v.split('-');
        return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : v;
    }

    // Static copy of the bill: inputs become plain text
    function buildPrintClone() {
        const src = document.getElementById('invoiceContainer');
        const clone = src.cloneNode(true);
        clone.removeAttribute('id');
        const srcFields = src.querySelectorAll('input, textarea');
        const cloneFields = clone.querySelectorAll('input, textarea');

        cloneFields.forEach((f, i) => {
            const s = srcFields[i];
            const div = document.createElement('div');
            let val = s.value;
            if (s.type === 'date') val = formatDate(val);
            div.textContent = val;
            div.style.whiteSpace = 'pre-wrap';
            div.style.minHeight = '18px';
            if (f.classList.contains('sig-name-input')) {
                div.style.cssText += 'font-weight:bold;font-size:15px;text-align:center;';
            } else if (f.classList.contains('table-input')) {
                div.style.textAlign = f.classList.contains('particulars') ? 'left' : 'center';
                div.style.fontSize = '13px';
            } else {
                div.style.padding = '4px 0';
                div.style.fontSize = '14px';
            }
            f.replaceWith(div);
        });

        clone.querySelectorAll('.no-print-col, .no-print').forEach(el => el.remove());
        const totalLabel = clone.querySelector('.total-row td[colspan]');
        if (totalLabel) totalLabel.setAttribute('colspan', '4');
        const widths = ['8%', '48%', '13%', '10%', '21%'];
        clone.querySelectorAll('thead th').forEach((th, i) => { if (widths[i]) th.style.width = widths[i]; });

        clone.style.cssText += 'width:794px;max-width:none;margin:0;padding:40px;border:none;box-shadow:none;background:#fff;box-sizing:border-box;';
        return clone;
    }

    async function downloadPDF() {
        const btn = document.querySelector('.btn-success');
        btn.disabled = true;
        const oldText = btn.innerText;
        btn.innerText = 'Please wait...';

        const stage = document.createElement('div');
        stage.id = 'pdfStage';
        stage.style.cssText = 'position:absolute;top:0;left:0;width:794px;background:#fff;z-index:99999;';
        stage.appendChild(buildPrintClone());
        document.body.appendChild(stage);
        window.scrollTo(0, 0);

        try {
            await new Promise(r => setTimeout(r, 300));
            const canvas = await html2canvas(stage, {
                scale: 2, backgroundColor: '#ffffff', useCORS: true, scrollX: 0, scrollY: 0
            });

            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF('p', 'mm', 'a4');
            const pageW = 210, pageH = 297;
            const imgH = canvas.height * pageW / canvas.width;
            const img = canvas.toDataURL('image/jpeg', 0.98);

            let y = 0;
            pdf.addImage(img, 'JPEG', 0, y, pageW, imgH);
            let left = imgH - pageH;
            while (left > 0) {
                y -= pageH;
                pdf.addPage();
                pdf.addImage(img, 'JPEG', 0, y, pageW, imgH);
                left -= pageH;
            }

            const billNo = document.getElementById('billNo').value || 'bill';
            pdf.save('Cash_Bill_' + billNo + '.pdf');
        } catch (err) {
            alert('PDF error: ' + err.message + '\nPlease use Print Bill > Save as PDF.');
        } finally {
            stage.remove();
            btn.disabled = false;
            btn.innerText = oldText;
        }
    }
</script>

</body>
</html>
