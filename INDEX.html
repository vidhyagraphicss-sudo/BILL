<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIDHYA GRAPHICS - Cash Bill</title>
    <!-- Include html2pdf library for PDF download feature -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
            padding: 20px;
        }
        .invoice-box {
            max-width: 800px;
            margin: auto;
            background: #fff;
            padding: 30px;
            border: 1px solid #ddd;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.15);
            box-sizing: border-box;
        }
        .header {
            text-align: center;
            border-bottom: 2px solid #333;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        .header h1 {
            margin: 0;
            font-size: 26px;
            letter-spacing: 1px;
            color: #111;
        }
        .header p {
            margin: 4px 0;
            font-size: 13px;
            color: #555;
        }
        .bill-title {
            text-align: center;
            font-weight: bold;
            text-decoration: underline;
            font-size: 16px;
            margin: 15px 0;
            color: #333;
        }
        .meta-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-size: 14px;
        }
        .meta-info div {
            width: 48%;
        }
        .meta-info label {
            font-weight: bold;
        }
        .meta-info input, .meta-info textarea {
            width: 100%;
            padding: 6px;
            margin-top: 4px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        table, th, td {
            border: 1px solid #000;
        }
        th, td {
            padding: 8px;
            text-align: center;
            font-size: 13px;
        }
        th {
            background-color: #f8f8f8;
        }
        td.particulars {
            text-align: left;
        }
        input.table-input {
            width: 100%;
            border: none;
            background: transparent;
            text-align: center;
            font-size: 13px;
        }
        input.table-input.particulars {
            text-align: left;
        }
        input.table-input:focus {
            outline: 1px solid #007bff;
        }
        .total-row td {
            font-weight: bold;
            background-color: #fdfdfd;
        }
        .signature-section {
            margin-top: 50px;
            padding-bottom: 20px;
            display: flex;
            justify-content: flex-end;
            page-break-inside: avoid;
        }
        .signature-box {
            width: 260px;
            border-top: 1px solid #000;
            padding-top: 6px;
            font-size: 14px;
            text-align: center;
        }
        .signature-img-container {
            height: 65px;
            margin-bottom: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .signature-img-container img {
            max-height: 60px;
            max-width: 200px;
            object-fit: contain;
        }
        .sig-name-input {
            width: 100%;
            border: none;
            text-align: center;
            font-weight: bold;
            font-size: 15px;
            font-family: Arial, sans-serif;
            background: transparent;
            color: #000;
        }
        .sig-name-input:focus {
            outline: 1px solid #007bff;
        }
        .print-sig-name {
            display: none;
            font-weight: bold;
            font-size: 15px;
            text-align: center;
        }
        .signature-label {
            font-size: 13px;
            font-weight: normal;
            margin-top: 2px;
            color: #333;
        }
        .no-print {
            text-align: center;
            margin-top: 20px;
        }
        .controls-panel {
            max-width: 800px;
            margin: 15px auto;
            background: #fff;
            padding: 15px 30px;
            border: 1px solid #ddd;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .btn {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 14px;
            cursor: pointer;
            border-radius: 4px;
        }
        .btn:hover {
            background-color: #0056b3;
        }
        .btn-success {
            background-color: #28a745;
        }
        .btn-success:hover {
            background-color: #218838;
        }
        .btn-danger {
            background-color: #dc3545;
            padding: 4px 8px;
            font-size: 12px;
        }
        .btn-danger:hover {
            background-color: #bd2130;
        }
        .custom-file-upload {
            border: 1px solid #ccc;
            display: inline-block;
            padding: 8px 12px;
            cursor: pointer;
            background: #f8f8f8;
            border-radius: 4px;
            font-size: 13px;
        }
        .custom-file-upload:hover {
            background: #e2e2e2;
        }

        /* Print styles */
        @media print {
            body {
                background: none;
                padding: 0;
            }
            .invoice-box {
                border: none;
                box-shadow: none;
                padding: 0;
                max-width: 100%;
            }
            .no-print, .controls-panel, .btn, .no-print-col {
                display: none !important;
            }
            input, textarea {
                border: none !important;
                outline: none !important;
                background: transparent !important;
            }
            .sig-name-input {
                display: none !important;
            }
            .print-sig-name {
                display: block !important;
            }
        }
    </style>
</head>
<body>

<div class="invoice-box" id="invoiceContainer">
    <!-- Header Details -->
    <div class="header">
        <h1>VIDHYA GRAPHICS</h1>
        <p>Muttikulangara, Palakkad - 678594</p>
        <p>Ph: 9048023437, 9072823437</p>
        <p>Email: vidhyagraphicss@gmail.com</p>
    </div>

    <div class="bill-title">CASH BILL</div>

    <div class="meta-info">
        <div>
            <label>NO:</label> <input type="text" id="billNo" value="001">
        </div>
        <div>
            <label>Date:</label> <input type="date" id="billDate">
        </div>
    </div>

    <div class="meta-info" style="width: 100%;">
        <div style="width: 100%;">
            <label>Name & Address:</label>
            <textarea id="custAddress" rows="2" placeholder="Enter customer name and address"></textarea>
        </div>
    </div>

    <!-- Bill Items Table -->
    <table id="billTable">
        <thead>
            <tr>
                <th style="width: 8%;">Sl. No.</th>
                <th style="width: 44%;">Particulars</th>
                <th style="width: 12%;">Rate (Rs.)</th>
                <th style="width: 10%;">Qty</th>
                <th style="width: 16%;">Amount (Rs.)</th>
                <th style="width: 10%;" class="no-print-col">Action</th>
            </tr>
        </thead>
        <tbody id="itemRows">
            <tr>
                <td>1</td>
                <td class="particulars"><input type="text" class="table-input particulars" placeholder="Item description"></td>
                <td><input type="number" class="table-input rate" oninput="calculateRow(this)" placeholder="0.00"></td>
                <td><input type="number" class="table-input qty" oninput="calculateRow(this)" placeholder="0"></td>
                <td><input type="number" class="table-input amount" readonly placeholder="0.00"></td>
                <td class="no-print-col"><button type="button" class="btn btn-danger" onclick="deleteRow(this)">X</button></td>
            </tr>
        </tbody>
        <tfoot>
            <tr class="total-row">
                <td colspan="4" style="text-align: right; padding-right: 15px;">TOTAL</td>
                <td id="grandTotal" style="text-align: center;">0.00</td>
                <td class="no-print-col"></td>
            </tr>
        </tfoot>
    </table>

    <div class="no-print" style="margin-bottom: 20px; text-align: left;">
        <button type="button" class="btn" onclick="addRow()">+ Add Item</button>
    </div>

    <!-- Signature Section -->
    <div class="signature-section">
        <div class="signature-box">
            <div class="signature-img-container" id="sigImageContainer"></div>
            <input type="text" class="sig-name-input" id="sigNameInput" value="" placeholder="Enter Name">
            <div class="print-sig-name" id="printSigNameDisplay"></div>
            <div class="signature-label">Signature</div>
        </div>
    </div>
</div>

<!-- Controls Panel for PDF, Print, and Signature Upload -->
<div class="controls-panel">
    <div>
        <label class="custom-file-upload">
            <input type="file" id="sigFile" accept="image/*" onchange="loadSignature(event)" style="display:none;"/>
            Upload Stamp / Signature Image
        </label>
    </div>
    <div>
        <button type="button" class="btn btn-success" onclick="downloadPDF()">Download PDF</button>
        <button type="button" class="btn" onclick="printBill()">Print Bill</button>
    </div>
</div>

<script>
    // Set today's date automatically
    document.getElementById('billDate').valueAsDate = new Date();

    function addRow() {
        const tbody = document.getElementById('itemRows');
        const rowCount = tbody.rows.length + 1;
        
        const newRow = tbody.insertRow();
        newRow.innerHTML = `
            <td>${rowCount}</td>
            <td class="particulars"><input type="text" class="table-input particulars" placeholder="Item description"></td>
            <td><input type="number" class="table-input rate" oninput="calculateRow(this)" placeholder="0.00"></td>
            <td><input type="number" class="table-input qty" oninput="calculateRow(this)" placeholder="0"></td>
            <td><input type="number" class="table-input amount" readonly placeholder="0.00"></td>
            <td class="no-print-col"><button type="button" class="btn btn-danger" onclick="deleteRow(this)">X</button></td>
        `;
    }

    function deleteRow(button) {
        const row = button.closest('tr');
        row.remove();
        updateSerialNumbers();
        calculateGrandTotal();
    }

    function updateSerialNumbers() {
        const rows = document.querySelectorAll('#itemRows tr');
        rows.forEach((row, index) => {
            row.cells[0].innerText = index + 1;
        });
    }

    function calculateRow(element) {
        const row = element.closest('tr');
        const rate = parseFloat(row.querySelector('.rate').value) || 0;
        const qty = parseFloat(row.querySelector('.qty').value) || 0;
        const amountField = row.querySelector('.amount');
        
        const totalAmount = rate * qty;
        amountField.value = totalAmount.toFixed(2);
        
        calculateGrandTotal();
    }

    function calculateGrandTotal() {
        const amounts = document.querySelectorAll('.amount');
        let grandTotal = 0;
        amounts.forEach(input => {
            grandTotal += parseFloat(input.value) || 0;
        });
        document.getElementById('grandTotal').innerText = grandTotal.toFixed(2);
    }

    function loadSignature(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const container = document.getElementById('sigImageContainer');
                container.innerHTML = `<img src="${e.target.result}" alt="Signature/Stamp" crossorigin="anonymous">`;
            }
            reader.readAsDataURL(file);
        }
    }

    function printBill() {
        const sigNameVal = document.getElementById('sigNameInput').value;
        document.getElementById('printSigNameDisplay').innerText = sigNameVal;
        window.print();
    }

    function downloadPDF() {
        const sigNameVal = document.getElementById('sigNameInput').value;
        const printSigDisplay = document.getElementById('printSigNameDisplay');
        const sigInput = document.getElementById('sigNameInput');

        printSigDisplay.innerText = sigNameVal;
        printSigDisplay.style.display = 'block';
        sigInput.style.display = 'none';

        // Temporarily hide action columns
        const noPrintCols = document.querySelectorAll('.no-print-col');
        noPrintCols.forEach(col => col.style.display = 'none');

        const element = document.getElementById('invoiceContainer');
        const billNo = document.getElementById('billNo').value || 'bill';
        
        const opt = {
            margin:       [10, 10, 10, 10],
            filename:     `Cash_Bill_${billNo}.pdf`,
            image:        { type: 'jpeg', quality: 0.98 },
            html2canvas:  { 
                scale: 2, 
                useCORS: true, 
                allowTaint: true, 
                logging: false, 
                letterRendering: true 
            },
            jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };

        html2pdf().from(element).set(opt).save().then(() => {
            sigInput.style.display = 'block';
            printSigDisplay.style.display = 'none';
            noPrintCols.forEach(col => col.style.display = '');
        });
    }
</script>

</body>
</html>
